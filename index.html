<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#EFEADB" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="数独练习" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />
<title>北京数独 51–64 岁组模拟卷</title>
<style>
  :root {
    --paper: #EFEADB;        /* 桌面/页底 */
    --sheet: #FBF8EF;        /* 答题纸 */
    --sheet-2: #F4EFE1;      /* 纸上浅底 */
    --rule: #D8D0BA;         /* 纸上分隔线 */
    --ink: #22252A;          /* 印刷墨 */
    --ink-2: #4A4D52;        /* 次要文字 */
    --ink-3: #6B6A63;        /* 辅助文字（保证对比度） */
    --pen: #2E7D32;          /* 你填的数字：绿色 */
    --graphite: #77746B;     /* 铅笔候选 */
    --red: #C23B2E;          /* 朱红：阅卷红笔 */
    --red-soft: #F6DDD6;
    --shade: #C9BC97;        /* 印刷灰（题目灰格、圆圈） */
    --shade-2: #A9A291;      /* 连续线 */
    --cell-peer: #D5D7D5;
    --cell-same: #B6DDB8;
    --cell-sel: #E4F1E4;
    --sel-frame: #2E7D32;
    --cell-bad: #F8D7D2;
    --accent: #2E7D32;       /* 主色：深绿 */
    --accent-soft: #E4F1E4;
    --accent-shadow: rgba(46, 125, 50, .28);
    --board-bg: #FFFFFF;
    --sel-bg: #2E7D32; --on-sel: #FFFFFF; --on-sel-mark: rgba(255, 255, 255, .28);
    --on-sel-given: #FFFFFF; --on-sel-pencil: #FFFFFF; --on-sel-dash: rgba(255, 255, 255, .4); --sel-shade-op: .3; --given-w: 400; --thin-w: 2;
    --given: #3C3C3C;
    --cell-hint: #FDF0CF;
    --hint: #D98A00;
    --hint-cell: #F5B53C;
    --tag-bg: #C2410C;
    --case1: #1D6FD1; --case2: #A21CAF;
    --viz-a: #F4C7A1; --viz-b: #BFDDB0; --viz-c: #C9DAF0; --viz-line: #D2553F; --viz-strong: #1F4E9C;
    --hint-bg: #FFF4D9;
    --grid-thin: #9FBF9F;
    --grid-thick: #2E6B31;
    --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
    --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
    --num: "Helvetica Neue", Arial, "Liberation Sans", "Noto Sans", sans-serif;
    --base: 16px;
    --board-max: 600px;
  }
  body.theme-dark {
    --paper: #15171B; --sheet: #1E2126; --sheet-2: #262A30; --rule: #3A3F47;
    --ink: #ECE7DA; --ink-2: #C9C4B8; --ink-3: #A39E92;
    --pen: #7FD685; --graphite: #9C978B; --red: #E5735F; --red-soft: #4A2620;
    --shade: #4A4F57; --shade-2: #7D838C;
    --cell-peer: #343A35; --cell-same: #2F5A35; --cell-sel: #22382A; --sel-frame: #66BB6A; --cell-bad: #4A2620;
    --accent: #66BB6A; --accent-soft: #22382A; --board-bg: #1A1D1B; --sel-bg: #3E9845; --on-sel: #FFFFFF; --on-sel-mark: rgba(255, 255, 255, .22); --on-sel-given: #FFFFFF; --on-sel-pencil: #FFFFFF; --on-sel-dash: rgba(255, 255, 255, .35);
    --given: #E4E4E4; --cell-hint: #3A3018; --hint: #F2B33D; --hint-cell: #B9821A; --hint-bg: #2E2715;
    --viz-a: #6B4A2E; --viz-b: #3D5A32; --viz-c: #2E4260; --viz-line: #E5735F; --viz-strong: #93B6F2;
    --grid-thin: #4A634B; --grid-thick: #7FBF82;
  }
  /* ---------- 蓝色配色（钢笔蓝，沿用之前的纸面配色） ---------- */
  body.scheme-blue {
    --pen: #1F4E9C; --accent: #1F4E9C; --accent-soft: #E3EBF7; --accent-shadow: rgba(31, 78, 156, .25);
    --board-bg: var(--sheet); --given: #22252A; --given-w: 700;
    --shade: #CDC6B3; --grid-thin: #B3AC99; --grid-thick: #22252A; --thin-w: 1.6;
    --cell-peer: #F0EADA; --cell-same: #F6E7A6; --cell-bad: #F6DDD6;
    --sel-bg: #F1D9BF; --cell-sel: #E3EBF7; --sel-frame: #1F4E9C;
    --on-sel: var(--pen); --on-sel-given: var(--ink); --on-sel-pencil: var(--graphite);
    --on-sel-mark: var(--shade); --on-sel-dash: var(--ink-2); --sel-shade-op: 1;
    --cell-hint: #FBF0D8; --hint-cell: #EFD08C; --hint-bg: #FDF6E6;
  }
  body.theme-dark.scheme-blue {
    --pen: #93B6F2; --accent: #93B6F2; --accent-soft: #24324A; --accent-shadow: rgba(0, 0, 0, .4);
    --board-bg: var(--sheet); --given: #ECE7DA;
    --shade: #4A4F57; --grid-thin: #4A4F57; --grid-thick: #D9D4C7;
    --cell-peer: #262A30; --cell-same: #4A3F1E; --cell-bad: #4A2620;
    --sel-bg: #4A3B2C; --cell-sel: #24426E; --sel-frame: #A8C6FF;
    --cell-hint: #33301F; --hint-cell: #7A6022; --hint-bg: #2A2618;
  }
  body.scheme-blue .numpad button.on, body.scheme-blue .modes button.on { color: #fff; }
  body.theme-dark.scheme-blue .numpad button.on, body.theme-dark.scheme-blue .modes button.on { color: #15171B; }
  body.font-large { --base: 18px; --board-max: 700px; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: var(--base); line-height: 1.55; }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .num { font-family: var(--num); font-variant-numeric: tabular-nums; }
  kbd { font-family: var(--num); font-size: .78em; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 3px; padding: 0 .35em; margin-left: .35em; color: var(--ink-3); background: var(--sheet); }

  /* ---------- 试卷抬头 ---------- */
  .masthead { background: var(--sheet); border-bottom: 1px solid var(--rule); }
  .masthead-in { max-width: 1280px; margin: 0 auto; padding: 14px 20px 10px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: flex-end; justify-content: space-between; }
  .masthead h1 { margin: 0; font-family: var(--serif); font-weight: 700; font-size: 1.45em; letter-spacing: .04em; }
  .masthead .sub { margin: 2px 0 0; font-family: var(--serif); color: var(--ink-2); font-size: .92em; }
  .masthead .group { display: inline-block; margin-left: .6em; padding: 0 .5em; border: 1.5px solid var(--red); color: var(--red); font-family: var(--sans); font-size: .62em; font-weight: 700; letter-spacing: .02em; vertical-align: .35em; border-radius: 3px; }
  .top-links { display: flex; gap: 4px; flex-wrap: wrap; }
  .link-btn { padding: 4px 10px; border-radius: 4px; color: var(--ink-2); font-size: .92em; }
  .link-btn:hover { background: var(--sheet-2); color: var(--ink); }
  .double-rule { max-width: 1280px; margin: 0 auto; height: 5px; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink); }

  /* ---------- 考场状态条 ---------- */
  .exam-bar { position: sticky; top: 0; z-index: 30; background: var(--sheet); border-bottom: 1px solid var(--rule); box-shadow: 0 2px 8px rgba(40, 32, 10, .06); }
  .exam-bar-in { max-width: 1280px; margin: 0 auto; padding: 8px 20px; display: flex; align-items: center; gap: 10px 22px; flex-wrap: wrap; }
  .clock { display: flex; align-items: baseline; gap: 10px; }
  .clock .lab { font-size: .85em; color: var(--ink-3); white-space: nowrap; }
  .clock .t { font-family: var(--num); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.6em; line-height: 1; color: var(--ink); }
  .clock.main .t { font-size: 2.15em; color: var(--red); letter-spacing: .01em; }
  .clock.main .t.low { animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .clock.main .t.low { animation: none; text-decoration: underline; } }
  .state { font-size: .82em; color: var(--ink-3); white-space: nowrap; }
  .state.on { color: var(--pen); }
  .state.done { color: var(--red); font-weight: 700; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 4px; border: 1.5px solid var(--ink); font-weight: 600; white-space: nowrap; background: var(--sheet); }
  .btn:hover { background: var(--sheet-2); }
  .btn.solid { background: var(--ink); color: var(--sheet); }
  .btn.solid:hover { background: var(--ink-2); }
  .btn.quiet { border-color: var(--rule); color: var(--ink-2); font-weight: 500; }
  .btn.quiet.armed { border-color: var(--red); color: var(--red); }
  .btn.hand-in { background: var(--red); border-color: var(--red); color: #fff; font-weight: 700; padding: 9px 22px; font-size: 1.05em; }
  .btn.hand-in:hover { filter: brightness(1.07); background: var(--red); }
  .btn.hand-in.ready { box-shadow: 0 0 0 4px var(--red-soft); }
  .bar-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .vsep { width: 1px; align-self: stretch; background: var(--rule); }

  /* ---------- 三栏布局 ---------- */
  .layout { max-width: 1280px; margin: 0 auto; padding: 18px 20px 48px; display: grid; grid-template-columns: 250px minmax(0, 1fr) 270px; gap: 20px; align-items: start; }
  .rail, .tools { position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow-y: auto; }
  .panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; }
  .panel-sec { padding: 12px 14px; border-bottom: 1px solid var(--rule); }
  .panel-sec:last-child { border-bottom: 0; }
  .sec-title { font-family: var(--serif); font-weight: 700; font-size: .95em; margin: 0 0 8px; }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden; }
  .tabs button { padding: 6px 0; font-weight: 600; }
  .tabs button.on { background: var(--ink); color: var(--sheet); }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button { padding: 3px 10px; border-radius: 4px; border: 1px solid var(--rule); font-size: .9em; }
  .seg button.on { border-color: var(--ink); background: var(--ink); color: var(--sheet); }
  .rounds { display: flex; flex-direction: column; gap: 2px; margin-top: 10px; }
  .rounds button { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 6px 8px; border-radius: 4px; text-align: left; border-left: 3px solid transparent; }
  .rounds button:hover { background: var(--sheet-2); }
  .rounds button.on { background: var(--sheet-2); border-left-color: var(--red); font-weight: 700; }
  .rounds small { color: var(--ink-3); font-size: .82em; white-space: nowrap; font-weight: 400; }
  select { width: 100%; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 4px; background: var(--sheet); margin-top: 8px; }
  .note { font-size: .82em; color: var(--ink-3); margin: 8px 0 0; }

  .qlist { list-style: none; margin: 0; padding: 0; }
  .qlist li + li { border-top: 1px dashed var(--rule); }
  .q { width: 100%; display: grid; grid-template-columns: 2.1em 1fr auto; gap: 2px 8px; align-items: center; padding: 7px 6px; text-align: left; border-radius: 4px; }
  .q:hover { background: var(--sheet-2); }
  .q.on { background: var(--cell-sel); }
  body.theme-dark .q.on { color: var(--ink); }
  .q .no { font-family: var(--num); font-weight: 700; font-size: 1.05em; color: var(--ink-2); grid-row: span 2; text-align: center; }
  .q .ty { font-weight: 600; font-size: .92em; line-height: 1.3; }
  .q .pt { font-size: .8em; color: var(--ink-3); white-space: nowrap; text-align: right; }
  .q .sub { font-size: .78em; color: var(--ink-3); }
  .q .mark { font-family: var(--num); font-size: .8em; color: var(--ink-3); text-align: right; white-space: nowrap; }
  .q .mark.ok { color: var(--red); font-weight: 700; font-size: 1em; }
  .bank-list { max-height: 52vh; overflow-y: auto; margin: 0 -6px; padding: 0 6px; }

  /* ---------- 答题卷 ---------- */
  .sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 18px 22px 16px; box-shadow: 0 1px 0 var(--rule), 0 8px 24px rgba(60, 48, 20, .06); }
  .q-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .q-head h2 { margin: 0; font-family: var(--serif); font-size: 1.3em; font-weight: 700; }
  .q-head .score { font-family: var(--serif); color: var(--ink-2); white-space: nowrap; }
  .q-rule { font-family: var(--serif); line-height: 1.75; margin: 8px 0 14px; color: var(--ink); max-width: 46em; }
  .board-wrap { position: relative; max-width: max(320px, min(var(--board-max), calc(100vh - 370px))); margin: 0 auto; }
  #board { width: 100%; height: auto; display: block; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  #board .hit { fill: transparent; cursor: pointer; }
  #board .hint-cell { animation: hintBreath 1.6s ease-in-out infinite; pointer-events: none; }
  #board .hint-cell.done { animation: none; opacity: .5; }
  @keyframes hintBreath { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .hint-box { margin: 0 0 12px; padding: 10px 14px; background: var(--hint-bg); border: 1px solid var(--hint); border-left-width: 5px; border-radius: 8px; line-height: 1.7; animation: hintIn .25s ease-out; }
  .hint-box { position: relative; padding-right: 52px; }
  .hint-x { position: absolute; top: 6px; right: 6px; width: 38px; height: 38px; border-radius: 50%; font-size: 26px; line-height: 1; color: var(--ink-2); background: var(--sheet); border: 1px solid var(--hint); display: flex; align-items: center; justify-content: center; }
  .hint-x:hover { background: var(--hint); color: #fff; }
  @media (hover: none) { .tool kbd, .hint-box .foot { display: none; } }
  .hint-box li { cursor: pointer; border-radius: 4px; padding: 1px 4px; margin-left: -4px; }
  .hint-box li:hover { background: var(--cell-hint); }
  .hint-box li.on { background: var(--hint-cell); }
  .tech-name { display: block; font-weight: 700; color: var(--pen); margin: 2px 0 4px; }
  .story { display: grid; gap: 8px; margin-top: 4px; }
  .story-n { font-size: .8em; color: var(--ink-3); }
  .story-t { font-size: 1.08em; line-height: 1.8; }
  .story-t b { color: var(--pen); }
  .cs1 { color: var(--case1); font-weight: 700; }
  .cs2 { color: var(--case2); font-weight: 700; }
  .ctag { display: inline-flex; align-items: center; justify-content: center; width: 1.45em; height: 1.45em; margin: 0 2px; border-radius: 50%; background: var(--tag-bg); color: #fff; font-family: var(--num); font-weight: 700; font-size: .9em; vertical-align: .05em; }
  .story-nav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .story-nav .btn { padding: 5px 14px; }
  .story-nav .btn[disabled] { opacity: .35; cursor: default; }
  .story-nav .dots { display: flex; gap: 5px; flex: 1; justify-content: center; flex-wrap: wrap; }
  .story-nav .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--rule); }
  .story-nav .dots i.on { background: var(--hint); }
  .story-all { margin-top: 6px; font-size: .9em; color: var(--ink-2); }
  .story-all summary { cursor: pointer; color: var(--ink-3); }
  .hint-box .foot { margin-top: 4px; font-size: .8em; color: var(--ink-3); }
  .hint-box ul { margin: 6px 0 4px; padding-left: 1.3em; }
  @keyframes hintIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #board .hint-cell, .hint-box { animation: none; } }
  .hint-tag { display: inline-block; margin-right: 8px; padding: 0 7px; border-radius: 3px; background: var(--hint); color: #fff; font-size: .82em; font-weight: 700; }
  #flash { position: fixed; left: 50%; z-index: 60; max-width: min(92vw, 520px); padding: 10px 16px; border-radius: 12px; background: var(--ink); color: var(--sheet); font-size: .95em; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transform: translate(-50%, 8px); transition: opacity .2s, transform .2s; }
  #flash.on { opacity: .96; pointer-events: auto; transform: translate(-50%, 0); }
  #flash.warn { background: var(--red); color: #fff; }
  #flash.success { background: #2f7d4f; color: #fff; }
  #toast ul { margin: 6px 0 4px; padding-left: 1.3em; }
  #toast li { margin: 2px 0; }
  #board text { font-family: var(--num); }
  .stamp { position: absolute; right: -6px; top: -14px; transform: rotate(-12deg); pointer-events: none; color: var(--red); border: 3px double var(--red); border-radius: 50%; width: 92px; height: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--serif); font-weight: 700; background: color-mix(in srgb, var(--sheet) 80%, transparent); }
  .stamp b { font-family: var(--num); font-size: 2.1em; line-height: 1; }
  .stamp span { font-size: .78em; }
  .q-head .right { display: flex; align-items: baseline; gap: 12px; }
  .fav-btn { font-family: var(--sans); font-size: .9em; color: var(--ink-3); border: 1px solid var(--rule); border-radius: 4px; padding: 2px 10px; white-space: nowrap; }
  .fav-btn:hover { border-color: var(--ink); color: var(--ink); }
  .fav-btn.on { color: var(--red); border-color: var(--red); }
  .note-box { margin-top: 10px; }
  .note-box summary { cursor: pointer; font-size: .88em; color: var(--ink-2); }
  .note-box textarea { width: 100%; min-height: 84px; margin-top: 6px; padding: 8px 10px; font: inherit; font-size: .92em; line-height: 1.6; color: var(--ink); background: var(--sheet-2); border: 1px solid var(--rule); border-radius: 4px; resize: vertical; }
  .q .star { color: var(--red); margin-left: 4px; font-size: .9em; }
  .q-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule); font-size: .82em; color: var(--ink-3); }

  .margin-note { margin: 0 0 14px; padding: 8px 12px; border-left: 3px solid var(--pen); background: var(--sheet); border-radius: 0 4px 4px 0; font-size: .95em; }
  .margin-note.warn, .margin-note.success { border-left-color: var(--red); }
  .margin-note.success { color: var(--red); font-weight: 600; }

  /* ---------- 作答工具 ---------- */
  .modes { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--accent); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
  .modes button { padding: 7px 0; font-weight: 600; color: var(--accent); }
  .modes button.on { background: var(--accent); color: #fff; }
  .numpad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .numpad button { border: 1.5px solid var(--grid-thin); border-radius: 12px; padding: 8px 0 6px; display: flex; flex-direction: column; align-items: center; line-height: 1.05; background: var(--board-bg); color: var(--accent); transition: transform .12s, box-shadow .12s, background .12s; }
  .numpad button:hover { border-color: var(--accent); }
  .numpad button:active { transform: scale(.95); }
  .numpad b { font-family: var(--num); font-size: 1.75em; font-weight: 500; }
  .numpad small { font-family: var(--num); font-size: .7em; color: var(--ink-3); margin-top: 2px; }
  .numpad button.on { background: var(--accent); border-color: var(--accent); color: #fff; transform: translateY(-3px); box-shadow: 0 6px 14px var(--accent-shadow); }
  .numpad button.on small { color: rgba(255, 255, 255, .85); }
  .numpad button.full { visibility: hidden; }
  .toolgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 2px; }
  .tool { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 4px; border-radius: 10px; color: var(--accent); }
  .tool:hover { background: var(--accent-soft); }
  .tool svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .tool .lbl { font-size: .76em; white-space: nowrap; }
  .tool kbd { position: absolute; top: 2px; right: 4px; margin: 0; font-size: .6em; padding: 0 .25em; }
  .tool.on { background: var(--accent-soft); }
  .tool.danger { color: var(--red); }
  .chk { display: flex; gap: 8px; align-items: center; font-size: .88em; color: var(--ink-2); cursor: pointer; }
  .chk input { accent-color: var(--ink); width: 16px; height: 16px; }

  /* ---------- 成绩单 ---------- */
  .palette { position: fixed; top: 0; right: 0; bottom: 0; z-index: 55; width: 330px; max-width: 92vw; background: var(--sheet); color: var(--ink); border-left: 1px solid var(--rule); box-shadow: -12px 0 30px rgba(0, 0, 0, .15); display: flex; flex-direction: column; padding: 16px 18px; }
  .palette[hidden] { display: none; }
  .pal-head { display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
  .pal-head b { font-family: var(--serif); font-size: 1.15em; }
  .pal-head span { font-size: .82em; color: var(--ink-3); flex: 1; }
  .pal-x { font-size: 1.5em; line-height: 1; color: var(--ink-3); }
  .pal-note { font-size: .82em; color: var(--ink-3); margin: 8px 0; }
  .pal-list { flex: 1; overflow-y: auto; margin: 0 -6px; padding: 0 6px; }
  .pal-row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--rule); font-size: .92em; }
  .pal-row small { display: block; color: var(--ink-3); font-size: .8em; }
  .pal-row input[type=color] { width: 44px; height: 30px; padding: 0; border: 1px solid var(--rule); border-radius: 6px; background: none; cursor: pointer; }
  .pal-row .undo { font-size: .8em; color: var(--ink-3); visibility: hidden; }
  .pal-row.changed .undo { visibility: visible; }
  .pal-row.changed > span:first-child::after { content: ' ●'; color: var(--accent); font-size: .8em; }
  .pal-foot { display: flex; gap: 8px; align-items: center; padding-top: 12px; border-top: 1px solid var(--rule); flex-wrap: wrap; }
  .pal-foot .grow { flex: 1; }
  .bk-text { width: 100%; min-height: 90px; margin: 6px 0; padding: 8px; font: .85em/1.4 var(--num); color: var(--ink); background: var(--sheet-2); border: 1px solid var(--rule); border-radius: 4px; }
  .photo-box { max-width: 960px; }
  .ph-msg { font-weight: 600; color: var(--pen); }
  .ph-tips { margin: 6px 0 12px; padding-left: 1.3em; color: var(--ink-2); }
  .ph-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; margin-top: 10px; }
  #ph-cv { width: 100%; height: auto; border: 1px solid var(--rule); border-radius: 4px; }
  .ph-grid { display: grid; border: 2.5px solid var(--grid-thick); aspect-ratio: 1; background: var(--board-bg); }
  .ph-cell { border: 1px solid var(--grid-thin); font-family: var(--num); font-size: 1.4em; display: flex; align-items: center; justify-content: center; padding: 0; min-width: 0; color: var(--ink-3); }
  .ph-cell.bb { border-bottom: 2.5px solid var(--grid-thick); } .ph-cell.br { border-right: 2.5px solid var(--grid-thick); }
  .ph-cell.given { color: var(--given); font-weight: 700; } .ph-cell.hand { color: var(--case1); }
  .ph-cell.bad { box-shadow: inset 0 0 0 3px var(--red); }
  .ph-cell.guess { box-shadow: inset 0 0 0 2px #e0a23a; }
  .ph-cell.sel { background: var(--cell-hint); }
  .ph-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; } .ph-tools .btn { padding: 4px 11px; }
  .ph-legend { font-size: .82em; color: var(--ink-3); margin: 8px 0 0; } .lg-g { color: var(--given); } .lg-h { color: var(--case1); }
  .ph-st { margin: 12px 0 6px; line-height: 1.8; } .ph-st .ok { color: #2E7D32; font-weight: 700; } .ph-st .warn { color: var(--red); }
  .ph-foot { display: flex; justify-content: flex-end; gap: 10px; } .ph-foot .btn[disabled] { opacity: .4; cursor: default; }
  @media (max-width: 760px) { .ph-wrap { grid-template-columns: 1fr; } }
  .modal { position: fixed; inset: 0; z-index: 60; background: rgba(30, 26, 15, .45); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal-box { background: var(--sheet); color: var(--ink); width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto; border-radius: 6px; border: 1px solid var(--rule); padding: 22px 26px; box-shadow: 0 20px 50px rgba(0, 0, 0, .25); }
  .modal-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
  .modal-head h3 { margin: 0; font-family: var(--serif); font-size: 1.25em; }
  .modal-body { padding: 14px 0 6px; }
  .modal-body p { margin: .6em 0; }
  .modal-foot { text-align: right; padding-top: 8px; }
  .grade { display: flex; align-items: center; gap: 22px; margin-bottom: 12px; }
  .grade .circle { flex: none; width: 150px; height: 104px; border: 3px solid var(--red); border-radius: 50%; transform: rotate(-6deg); display: flex; align-items: center; justify-content: center; color: var(--red); }
  .grade .circle b { font-family: var(--num); font-size: 3em; font-weight: 700; line-height: 1; }
  .grade .circle span { font-family: var(--serif); font-size: 1.1em; margin-left: 2px; }
  .grade .detail { color: var(--ink-2); font-size: .95em; }
  table { width: 100%; border-collapse: collapse; font-size: .92em; }
  th { font-family: var(--serif); text-align: left; font-weight: 700; border-bottom: 1.5px solid var(--ink); padding: 6px 4px; }
  td { border-bottom: 1px solid var(--rule); padding: 6px 4px; }
  td.n, th.n { text-align: right; font-family: var(--num); font-variant-numeric: tabular-nums; }
  td.ok { color: var(--red); font-weight: 700; }
  .rules-table td:first-child { white-space: nowrap; font-weight: 600; }

  /* ---------- 窄屏 ---------- */
  @media (max-width: 1100px) {
    .layout { grid-template-columns: 220px minmax(0, 1fr); }
    .rail { grid-column: 1; grid-row: 1 / span 2; }
    main { grid-column: 2; grid-row: 1; min-width: 0; }
    .tools { grid-column: 2; grid-row: 2; position: sticky; top: auto; bottom: 0; z-index: 20; max-height: none; overflow: visible; padding-bottom: env(safe-area-inset-bottom, 0px); }
    .tools .panel { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); box-shadow: 0 -8px 24px rgba(0, 0, 0, .10); }
    .tools .panel-sec { border-bottom: 0; }
    .tools .panel-sec:first-child { border-right: 1px solid var(--rule); }
    .tools .panel-sec:last-child { grid-column: 1 / -1; border-top: 1px solid var(--rule); padding: 6px 14px; }
    .tools .note { display: none; }
    .tools .modes { margin-bottom: 8px; }
    .tools .modes button { padding: 5px 0; }
    .tools .toolgrid { gap: 2px; }
    .board-wrap { max-width: max(340px, min(var(--board-max), calc(100vh - 540px))); }
  }
  @media (max-width: 760px) {
    .masthead-in { padding: 10px 16px 8px; }
    .masthead h1 { font-size: 1.15em; }
    .exam-bar-in { padding: 6px 16px; gap: 6px 14px; }
    .clock .lab { display: none; }
    .clock.main .t { font-size: 1.7em; }
    .clock .t { font-size: 1.3em; }
    .vsep, .state, #btn-reset { display: none; }
    .btn.hand-in { padding: 7px 14px; font-size: .95em; }
    .layout { grid-template-columns: 1fr; padding: 12px 16px 40px; gap: 12px; }
    .rail, .tools, main { grid-column: auto; grid-row: auto; }
    .rail { position: static; max-height: none; }
    .tools .panel { grid-template-columns: 1fr; }
    .tools .panel-sec:first-child { border-right: 0; border-bottom: 1px solid var(--rule); }
    .rail .qlist { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
    .rail .qlist li + li { border-top: 0; }
    .rail .qlist .q { width: auto; min-width: 168px; border: 1px solid var(--rule); grid-template-columns: 1.6em 1fr auto; }
    .rail .qlist .q .ty { white-space: nowrap; }
    .rounds { flex-direction: row; flex-wrap: wrap; }
    .rounds button { flex: 1 1 auto; flex-direction: column; align-items: flex-start; gap: 0; border-left: 0; border-bottom: 3px solid transparent; }
    .rounds button.on { border-bottom-color: var(--red); }
    .bank-list { max-height: none; }
    .sheet { padding: 14px 12px; }
    .stamp { width: 72px; height: 72px; right: -4px; top: -10px; }
    .numpad { grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; }
    .numpad button { padding: 5px 0 3px; }
    .numpad b { font-size: 1.4em; }
    .tools .toolgrid { grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .tool { padding: 4px 0 2px; }
    .tool svg { width: 22px; height: 22px; }
    .tool .lbl { font-size: .7em; }
    .tools .panel-sec { padding: 8px 10px; }
    .tools .panel-sec:last-child { display: none; }
    .board-wrap { max-width: 100%; }
  }
  @media print { .exam-bar, .rail, .tools, .top-links { display: none !important; } .layout { display: block; } }
</style>
</head>
<body>
<header class="masthead">
  <div class="masthead-in">
    <div>
      <h1>北京市数独锦标赛 模拟卷<span class="group">51–64 岁组</span></h1>
      <p class="sub">依据《2026 年北京市数独锦标赛题型说明》，题目取自北京市发放的练习题</p>
    </div>
    <nav class="top-links">
      <button type="button" class="link-btn" id="btn-rules">赛制说明</button>
      <button type="button" class="link-btn" id="btn-export">备份进度</button>
      <button type="button" class="link-btn" id="btn-import">恢复进度</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden />
      <button type="button" class="link-btn" id="btn-scheme">配色：蓝</button>
      <button type="button" class="link-btn" id="btn-photo">拍照导入</button>
      <button type="button" class="link-btn" id="btn-palette">调色盘</button>
      <button type="button" class="link-btn" id="btn-font">字号：标准</button>
      <button type="button" class="link-btn" id="btn-theme">切换夜间模式</button>
    </nav>
  </div>
  <div class="double-rule"></div>
</header>

<div class="exam-bar">
  <div class="exam-bar-in">
    <div class="clock main" id="round-clock"><span class="lab" id="round-label">第一轮剩余</span><span class="t" id="timer-display">30:00</span></div>
    <button type="button" class="btn solid" id="btn-timer">开始计时</button>
    <div class="vsep" id="bar-sep"></div>
    <div class="clock"><span class="lab" id="puz-label">本题用时</span><span class="t" id="puzzle-time">00:00</span></div>
    <span class="state" id="puzzle-state">未开始</span>
    <button type="button" class="btn" id="btn-bank-timer" hidden>开始计时</button>
    <div class="bar-right">
      <button type="button" class="btn quiet" id="btn-reset">重置本轮</button>
      <button type="button" class="btn hand-in" id="btn-submit">交卷</button>
    </div>
  </div>
</div>

<div class="layout">
  <aside class="rail">
    <div class="panel">
      <div class="panel-sec">
        <div class="tabs" id="mode-tabs"><button type="button" data-mode="mock">模拟赛</button><button type="button" data-mode="bank">题库加练</button></div>
        <div id="mock-select">
          <div class="seg" id="set-tabs" style="margin-top:10px"></div>
          <div class="rounds" id="round-tabs"></div>
          <p class="note" id="set-note"></p>
        </div>
        <div id="bank-select" hidden>
          <div class="seg" id="group-tabs" style="margin-top:10px"></div>
          <select id="type-select" aria-label="题型"></select>
          <p class="note" id="bank-count"></p>
        </div>
      </div>
      <div class="panel-sec">
        <ul class="qlist" id="qlist"></ul>
      </div>
    </div>
  </aside>

  <main>
    <div id="toast" class="margin-note" hidden></div>
    <article class="sheet">
      <div class="q-head"><h2 id="pz-title"></h2><div class="right"><span class="score" id="pz-score"></span><button type="button" class="fav-btn" id="btn-fav">☆ 收藏</button></div></div>
      <p class="q-rule" id="pz-rule"></p>
      <div class="hint-box" id="hint-box" hidden></div>
      <div class="board-wrap">
        <svg id="board" xmlns="http://www.w3.org/2000/svg" role="grid" aria-label="数独盘面"></svg>
        <div class="stamp" id="stamp" hidden><b>✓</b><span>全对</span></div>
      </div>
      <div class="q-foot"><span id="pz-src"></span><span id="pz-progress" class="num"></span></div>
      <details class="note-box" id="note-box"><summary id="note-summary">我的笔记</summary><textarea id="note" placeholder="记下这道题的突破口、卡住的地方或有意思的思路。内容会自动保存。"></textarea></details>
    </article>
  </main>

  <aside class="tools">
    <div class="panel">
      <div class="panel-sec">
        <div class="toolgrid">
          <button type="button" class="tool" id="btn-erase" title="擦除这一格（C）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M12 9l6 6M18 9l-6 6"/></svg><span class="lbl">擦除</span><kbd>C</kbd></button>
          <button type="button" class="tool" id="btn-undo" title="撤销一步（Z）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg><span class="lbl">撤销</span><kbd>Z</kbd></button>
          <button type="button" class="tool" id="btn-auto" title="自动填写候选数"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20L15 9"/><path d="M14 6l1-3 1 3 3 1-3 1-1 3-1-3-3-1z"/><path d="M19 13l.5-1.5L21 11l-1.5-.5L19 9l-.5 1.5L17 11l1.5.5z"/></svg><span class="lbl">候选数</span></button>
          <button type="button" class="tool" id="btn-hint" title="分三步给提示（H）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg><span class="lbl">提示</span><kbd>H</kbd></button>
          <button type="button" class="tool" id="btn-check" title="检查已填的数"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/></svg><span class="lbl">检查</span></button>
          <button type="button" class="tool" id="btn-answer" title="查看答案"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="lbl">答案</span></button>
          <button type="button" class="tool danger" id="btn-clear" title="清空本题重新做"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 109-9 9.7 9.7 0 00-6.7 2.8L3 8"/><path d="M3 3v5h5"/></svg><span class="lbl">重做</span></button>
        </div>
      </div>
      <div class="panel-sec">
        <div class="modes"><button type="button" id="btn-normal" class="on">填数</button><button type="button" id="btn-pencil">铅笔记号</button></div>
        <div class="numpad" id="numpad"></div>
        <p class="note">也可以直接用键盘数字键，空格键切换铅笔记号。</p>
      </div>
      <div class="panel-sec">
        <label class="chk"><input type="checkbox" id="chk-hl" checked /> 高亮同行、同列、同宫和相同数字</label>
      </div>
    </div>
  </aside>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <div class="modal-head"><h3 id="modal-title"></h3><button type="button" class="link-btn" id="modal-x">关闭</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot"><button type="button" class="btn solid" id="modal-ok">知道了</button></div>
  </div>
</div>

<div id="photo" class="modal" hidden>
  <div class="modal-box photo-box" role="dialog" aria-label="拍照导入">
    <div class="modal-head"><h3>拍照导入</h3><button type="button" class="pal-x" id="ph-x" aria-label="关闭">×</button></div>
    <div id="ph-body"></div>
  </div>
</div>
<input type="file" id="ph-file" accept="image/*" multiple hidden />
<aside class="palette" id="palette" hidden aria-label="调色盘">
  <div class="pal-head"><b>调色盘</b><span id="pal-scope"></span><button type="button" class="pal-x" id="pal-close" aria-label="关闭">×</button></div>
  <p class="pal-note">在当前配色的基础上微调，改动会立刻显示在盘面上。点“保存”后记住，下次打开还在。</p>
  <div class="pal-list" id="pal-list"></div>
  <div class="pal-foot">
    <button type="button" class="btn" id="pal-default" title="这套配色全部恢复成默认颜色">全部恢复默认</button>
    <span class="grow"></span>
    <button type="button" class="btn" id="pal-cancel">取消</button>
    <button type="button" class="btn solid" id="pal-save">保存</button>
  </div>
</aside>

        steps.push(`假设 ${W(path[0])} 不是 ${I.z0}（那它是 ${out}）`);
        for (let k = 1; k < path.length; k++) { const nx = pv[path[k]].find(z => z !== out); steps.push(`${W(path[k])} 是 ${nx}`); out = nx; }
      }

    simple.forEach(r => { const b = blockOf(r); if (b) { const j = +b[0]; blocks.set(j, [...(blocks.get(j) || []), r.x]); } else others.push(r); });
    const SHORT = v => ({ '虚线框': `放 ${v} 后虚线框的和对不上`, '杀手框的数字组合': `所在虚线框的组合里没有 ${v}`, '区域求和': `按区域总和推算，用不到 ${v}`, '提示': `和旁边的提示配不上`, '奇偶': `奇偶不符`, '提示数占位': `${v} 已被提示占住` });

    byS.forEach((xs, k) => parts.push(`${xs.map(W).join('')} ${k}`));

    const extra = { tint: focus, circle: [...blocks.keys()], lines: [...blocks.entries()].flatMap(([j, xs]) => xs.map(x => [j, x, 'ray'])) };

      simple.forEach(r => addCross(r.x));
      push(Object.assign({}, extra, { text: `刚才划掉了 ${hard.map(r => W(r.x)).join('、')} 的 ${d}。现在再看${name(gr.name)}：${parts.length ? parts.join('；') + '，' : ''}只剩 ${W(i)} 能放 ${d}。`, ghost: { [i]: d } }));
    }

  frames.forEach(f => {

}
function hintValid() {

/* ---------- 交卷 ---------- */
function submitRound(auto) {
  const ids = DATA.mocks[S.set][S.round], R = ROUNDS[S.round], t = roundTimer();
  let base = 0, all = true;
  const rows = ids.map((id, k) => {
    const q = DATA.puzzles[id], key = keyOf(id), ok = isSolved(id, key), P = prep(id);
    if (ok) base += POINTS[q.k]; else all = false;
    return `<tr><td>${k + 1}　${TYPES[q.k].name}</td><td class="n">${POINTS[q.k]}</td><td class="n">${filledCount(id, key)}/${P.C}</td><td class="n">${fmt(S.times[key] || 0)}</td>

  }).join('');

    <div class="grade"><div class="circle"><b>${total}</b><span>分</span></div>
      <div class="detail">${auto ? '时间到，已自动交卷。<br>' : ''}卷面 ${base} 分（满分 ${R.total}）<br>提前交卷奖励 ${bonus} 分<br>用时 ${fmt(R.min * 60 - t.rem)}，剩余 ${fmt(t.rem)}</div></div>

/* ---------- 计时 ---------- */

}
setInterval(() => {
  const now = Date.now(); acc += now - lastTs; lastTs = now;

$('btn-import').onclick = () => {
  openModal('恢复进度', `<p>把备份码粘贴到下面，或者选择之前保存的备份文件。</p>
    <textarea id="rs-text" class="bk-text" placeholder="在这里粘贴备份码"></textarea>
    <p><button type="button" class="btn solid" id="rs-go">读取备份码</button>　<button type="button" class="btn" id="rs-file">选择备份文件</button></p>
    <p id="rs-msg"></p>`);
  $('rs-go').onclick = () => { let o; try { o = JSON.parse($('rs-text').value.trim()); } catch (e) { $('rs-msg').textContent = '读不出来，请确认备份码复制完整了。'; return; } restoreFrom(o); };
  $('rs-file').onclick = () => $('import-file').click();
};
$('import-file').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { let o; try { o = JSON.parse(rd.result); } catch (err) { $('rs-msg').textContent = '这个文件不是有效的进度备份。'; return; } restoreFrom(o); };
  rd.readAsText(f);
});

function phKey(e) {

/* ---------- 调色盘 ---------- */

  ['--shade-2', '连续线'], ['--cell-bad', '冲突的格子'], ['--hint-cell', '提示格（呼吸灯）'], ['--cell-hint', '提示要看的区域'],

let CUSTOM = {};

const comboKey = () => (S.scheme === 'green' ? 'green' : 'blue') + (S.theme ? '-dark' : '-light');
